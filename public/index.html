<!DOCTYPE html>
<html>
<head>
  <title>AI Image Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>AI Image Generator</h1>
    <input type="text" id="prompt" placeholder="Describe the image you want...">
    <button onclick="generateImage()">Generate</button>
    <div class="result">
      <img id="generated-image" style="display: none;">
    </div>
  </div>

  <script>
    async function generateImage() {
      const prompt = document.getElementById('prompt').value;
      const imgElement = document.getElementById('generated-image');
      
      if (!prompt) {
        alert('Please enter a prompt');
        return;
      }

      imgElement.style.display = 'none';
      
      // Panggil API kita di Vercel
      const response = await fetch(`/api/generate?prompt=${encodeURIComponent(prompt)}`);
      
      if (response.ok) {
        const imageBlob = await response.blob();
        const imageUrl = URL.createObjectURL(imageBlob);
        imgElement.src = imageUrl;
        imgElement.style.display = 'block';
      } else {
        alert('Failed to generate image');
      }
    }
  </script>
</body>
</html>
