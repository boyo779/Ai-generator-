<!DOCTYPE html>
<html>
<head>
  <title>AI Image Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>AI Image Generator</h1>
    <input type="text" id="prompt" placeholder="Describe the image you want...">
    <button onclick="generateImage()">Generate</button>
    <div class="result">
      <img id="generated-image" style="display: none;">
    </div>
  </div>

  <script>
    async function generateImage() {
  const prompt = document.getElementById('prompt').value;
  const imgElement = document.getElementById('generated-image');
  
  if (!prompt) {
    alert('Masukkan prompt terlebih dahulu');
    return;
  }

  imgElement.src = '';
  imgElement.style.display = 'none';
  
  try {
    // Tambah parameter cache busting
    const apiUrl = `/api/generate?prompt=${encodeURIComponent(prompt)}&t=${Date.now()}`;
    const response = await fetch(apiUrl);
    
    if (response.ok) {
      const blob = await response.blob();
      imgElement.src = URL.createObjectURL(blob);
      imgElement.style.display = 'block';
    } else {
      throw new Error(await response.text());
    }
  } catch (error) {
    console.error('Error:', error);
    alert('Gagal generate gambar: ' + error.message);
  }
    } 
  </script>
</body>
</html>
