<!DOCTYPE html>
<html>
<head>
  <title>AI Image Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>AI Image Generator</h1>
    <input type="text" id="prompt" placeholder="Describe the image you want...">
    <button onclick="generateImage()">Generate</button>
    <div class="result">
      <img id="generated-image" style="display: none;">
    </div>
  </div>
   <script>
async function generateImage() {
  const prompt = encodeURIComponent(document.getElementById('prompt').value);
  const imgElement = document.getElementById('generated-image');
  
  if (!prompt) {
    alert('Prompt tidak boleh kosong');
    return;
  }

  imgElement.style.display = 'none';
  imgElement.src = '';
  
  try {
    // Gunakan URL absolut untuk development/production
    const apiUrl = window.location.hostname === 'localhost' 
      ? `http://localhost:3000/api/generate?prompt=${prompt}`
      : `/api/generate?prompt=${prompt}`;
    
    const response = await fetch(apiUrl);
    
    if (response.ok) {
      const blob = await response.blob();
      imgElement.src = URL.createObjectURL(blob);
      imgElement.style.display = 'block';
    } else {
      throw new Error(await response.text());
    }
  } catch (error) {
    console.error('Error:', error);
    alert('Gagal generate: ' + error.message);
  }
}
</script> 
</body>
</html>
